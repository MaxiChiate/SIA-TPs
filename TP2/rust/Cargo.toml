[package]
name = "triangles-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"   # f64::round_ties_even, needed to match Python's round()
description = "Rasterize-and-score kernel for the TP2 triangles problem"
license = "MIT"

[lib]
name = "triangles_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py312"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Same optimizations, spread across every core instead of funnelled into one
# LLVM module: fat LTO plus codegen-units=1 leaves the tail of a release build
# single-threaded, which is the part that hurts while iterating on the kernel.
# ThinLTO runs its passes across units in parallel, so this saturates the box at
# the cost of a slightly slower binary -- benchmark with --release, not here.
#   cd rust && CARGO_BUILD_JOBS=20 maturin develop --profile parallel
[profile.parallel]
inherits = "release"
lto = "thin"
codegen-units = 16

# A forgotten --release should be merely slow, not useless: an opt-level=0 build
# of this kernel is slower than the Pillow implementation it replaces.
[profile.dev]
opt-level = 2
