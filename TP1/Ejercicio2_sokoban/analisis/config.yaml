# Config del runner de experimentos (analisis/main.py).
# Las rutas relativas se resuelven contra la raíz del proyecto (Ejercicio2_sokoban/).

# --- paralelismo -----------------------------------------------------------
# process : un proceso por ejecución. Tiempos limpios (sin GIL de por medio) y
#           el timeout mata de verdad al worker. RECOMENDADO para medir.
# thread  : ThreadPoolExecutor. Los algoritmos son Python puro y CPU-bound, así
#           que el GIL los serializa: no hay speedup, los tiempos concurrentes
#           se contaminan y el timeout no puede matar el thread.
executor: process

# Ejecuciones simultáneas. Ojo con la memoria: BFS/A* sobre level_69 llegan a
# ~4M de estados (varios GB), así que 4 workers ya pueden ser muchos.
workers: 4

# --- experimento -----------------------------------------------------------
# Cuántas veces se corre CADA combinación (nivel x algoritmo).
# Los algoritmos son deterministas: cost/nodes_expanded/frontier_nodes van a
# repetirse idénticos entre repeticiones. Lo que varía es el TIEMPO, así que
# repetitions sirve para promediar tiempos y estimar su dispersión.
repetitions: 5

# Corta una ejecución que se pasa de este tiempo (segundos). null = sin límite.
# Necesario: iddfs sobre level_01_ufo y greedy sobre level_69 no terminan en
# minutos, y sin timeout la tanda se cuelga ahí para siempre.
timeout_seconds: 60

# Límite de memoria por worker, en MB (solo con executor: process). null = sin
# límite. Si el worker lo excede muere y la fila queda con status=error, en vez
# de mandar toda la máquina a swap.
memory_limit_mb: 4096

# --- qué correr ------------------------------------------------------------
# Lista de stems de archivo, o "all" para tomar todos los .txt de levels_dir.
levels:
  - level_01_ufo
  - level_69

# Opcional. Default: sokoban/levels
levels_dir: sokoban/levels

# Cada item puede ser un string (algoritmo sin heurística) o un mapping con
# name + heuristic. La heurística solo aplica a astar/greedy (los informados);
# en el resto se ignora y sale como vacía en el CSV.
algorithms:
  - bfs
  - dfs
  - iddfs
  - name: greedy
    heuristic: manhattan_sum
  - name: astar
    heuristic: manhattan_sum

# --- salida ----------------------------------------------------------------
output_dir: analisis/resultados

# Nombre del CSV. null = results_<run_id>.csv (run_id = timestamp UTC), así
# cada tanda queda en su propio archivo sin pisar la anterior.
output_file: null

# Incluir la columna `solution` (el string completo de movimientos). Ponelo en
# false si querés un CSV más liviano para el análisis.
include_solution: true
