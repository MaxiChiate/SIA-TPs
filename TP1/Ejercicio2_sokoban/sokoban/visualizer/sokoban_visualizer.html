<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Sokoban · visor</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1c1f27;
    --panel-border: #2b2f3a;
    --floor: #262a35;
    --wall: #0a0b0e;
    --wall-edge: #303543;
    --goal-ring: #4a5568;
    --text: #e6e8ee;
    --text-dim: #8a90a2;
    --accent: #5b8cff;
    --accent-dim: #2f3d63;
    --box: #d1893f;
    --box-edge: #a5652a;
    --box-goal: #4caf6f;
    --box-goal-edge: #37844f;
    --player: #f2c14e;
    --player-edge: #b9922c;
    --danger: #e0616b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Consolas, "Cascadia Code", monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 24px 16px 40px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    margin: 0;
    text-transform: uppercase;
  }
  #layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  #board-wrap {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px;
  }
  #board {
    display: grid;
    gap: 2px;
    background: var(--wall-edge);
    border: 2px solid var(--wall-edge);
    border-radius: 4px;
  }
  .cell {
    width: 30px;
    height: 30px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cell.wall { background: var(--wall); }
  .cell.floor { background: var(--floor); }
  .cell.goal::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--goal-ring);
    transform: translate(-50%, -50%);
  }
  .cell .box {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    background: var(--box);
    border: 2px solid var(--box-edge);
  }
  .cell .box.on-goal {
    background: var(--box-goal);
    border-color: var(--box-goal-edge);
  }
  .cell .player {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--player);
    border: 2px solid var(--player-edge);
    z-index: 2;
  }
  #side {
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .panel h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 10px;
    font-weight: 600;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    background: var(--accent-dim);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 7px 11px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: #0c1220; font-weight: 600; }
  #speed-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-dim);
  }
  #speed { flex: 1; }
  #counter {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 10px;
  }
  #counter b { color: var(--text); }
  #solution-trace {
    margin-top: 10px;
    line-height: 1.6;
    font-size: 13px;
    word-break: break-all;
  }
  #solution-trace span.done { color: var(--text-dim); }
  #solution-trace span.current {
    background: var(--accent);
    color: #0c1220;
    border-radius: 3px;
  }
  #solution-trace span.pending { color: var(--text); }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr auto;
    row-gap: 6px;
    font-size: 13px;
  }
  .stats-grid dt { color: var(--text-dim); }
  .stats-grid dd { margin: 0; text-align: right; }
  .ok { color: var(--box-goal); }
  .fail { color: var(--danger); }
  #error {
    color: var(--danger);
    font-size: 12px;
    margin-top: 8px;
    display: none;
  }
</style>
</head>
<body>

<h1>Sokoban &middot; Fase 0</h1>

<div id="layout">
  <div id="board-wrap"><div id="board"></div></div>

  <div id="side">
    <div class="panel">
      <h2 id="level-name">nivel</h2>
      <div id="controls">
        <button id="btn-first" title="Ir al principio (Inicio)">|&laquo;</button>
        <button id="btn-prev" title="Paso atrás (&larr;)">&lsaquo;</button>
        <button id="btn-play" class="primary" title="Reproducir / pausar (espacio)">&#9654;</button>
        <button id="btn-next" title="Paso adelante (&rarr;)">&rsaquo;</button>
        <button id="btn-last" title="Ir al final (Fin)">&raquo;|</button>
      </div>
      <div id="speed-row">
        <span>velocidad</span>
        <input id="speed" type="range" min="1" max="20" value="8" />
        <span id="speed-label">8 mov/s</span>
      </div>
      <div id="counter">movimiento <b id="counter-val">0</b> / <span id="counter-total">0</span></div>
      <div id="solution-trace"></div>
      <div id="error"></div>
    </div>

    <div class="panel">
      <h2>corrida</h2>
      <dl class="stats-grid">
        <dt>algoritmo</dt><dd id="stat-algorithm">-</dd>
        <dt>heurística</dt><dd id="stat-heuristic">-</dd>
        <dt>config</dt><dd id="stat-config">-</dd>
        <dt>generado</dt><dd id="stat-generated-at">-</dd>
      </dl>
    </div>

    <div class="panel">
      <h2>resultado (SearchResult)</h2>
      <dl class="stats-grid">
        <dt>success</dt><dd id="stat-success">-</dd>
        <dt>cost</dt><dd id="stat-cost">-</dd>
        <dt>nodes_expanded</dt><dd id="stat-nodes">-</dd>
        <dt>frontier_nodes</dt><dd id="stat-frontier">-</dd>
        <dt>elapsed_seconds</dt><dd id="stat-elapsed">-</dd>
      </dl>
    </div>

    <div class="panel">
      <h2>nivel / movimientos</h2>
      <dl class="stats-grid">
        <dt>tablero</dt><dd id="stat-board">-</dd>
        <dt>cajas / goals</dt><dd id="stat-boxes">-</dd>
        <dt>empujes / pasos</dt><dd id="stat-moves">-</dd>
      </dl>
    </div>
  </div>
</div>

<script type="application/json" id="run-data">
{
  "level_name": "aenigma_01",
  "level_lines": [
    "      ###",
    "      #.#",
    "  #####.#####",
    " ##         ##",
    "##  # # # #  ##",
    "#  ##     ##  #",
    "# ##  # #  ## #",
    "#     $@$     #",
    "####  ###  ####",
    "   #### ####"
  ],
  "solution": "LruulldlddrUUUUdddlllluurururRRlddrruUUdrrddllddRluurrdrddlUUUUddrdrrruulululLLrddlluU",
  "result": {
    "success": true,
    "cost": 86,
    "nodes_expanded": 0,
    "frontier_nodes": 0,
    "elapsed_seconds": 0.0000011
  },
  "algorithm": "hardcoded",
  "heuristic": null,
  "config_path": null,
  "generated_at": null,
  "board": { "width": 15, "height": 10, "boxes": 2, "goals": 2 },
  "moves": { "pushes": 17, "steps": 69 }
}
</script>
<script>
const RUN = JSON.parse(document.getElementById("run-data").textContent);
const LEVEL_NAME = RUN.level_name;
const LEVEL_LINES = RUN.level_lines;
const SOLUTION = RUN.solution;
const RESULT = RUN.result;

// ---------------------------------------------------------------------------
// Charset de game-sokoban.com: '#' pared, ' ' piso, '.' goal, '$' caja,
// '@' jugador, '*' caja sobre goal, '+' jugador sobre goal.
// Mismas reglas que sokoban/parser.py y sokoban/engine.py.
// ---------------------------------------------------------------------------
function parseLevel(lines) {
  const width = Math.max(...lines.map((l) => l.length));
  const padded = lines.map((l) => l.padEnd(width, " "));
  const height = padded.length;

  const walls = new Set();
  const goals = new Set();
  const boxes = new Set();
  let player = null;

  padded.forEach((line, y) => {
    for (let x = 0; x < width; x++) {
      const ch = line[x];
      const key = `${x},${y}`;
      switch (ch) {
        case "#": walls.add(key); break;
        case " ": break;
        case ".": goals.add(key); break;
        case "$": boxes.add(key); break;
        case "@": player = [x, y]; break;
        case "*": goals.add(key); boxes.add(key); break;
        case "+": goals.add(key); player = [x, y]; break;
        default: throw new Error(`Carácter desconocido '${ch}' en (${x},${y})`);
      }
    }
  });

  if (!player) throw new Error("El nivel no tiene jugador");
  return { width, height, walls, goals, initialBoxes: boxes, initialPlayer: player };
}

const DIRS = {
  u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0],
};

function applyMove(state, level, move) {
  const [dx, dy] = DIRS[move.toLowerCase()];
  const push = move === move.toUpperCase();
  const [px, py] = state.player;
  const dest = [px + dx, py + dy];
  const destKey = `${dest[0]},${dest[1]}`;

  if (level.walls.has(destKey)) {
    throw new Error(`Movimiento '${move}' inválido: ${destKey} es pared`);
  }
  const boxAhead = state.boxes.has(destKey);

  if (push) {
    if (!boxAhead) throw new Error(`'${move}' es empuje pero no hay caja en ${destKey}`);
    const boxDest = [dest[0] + dx, dest[1] + dy];
    const boxDestKey = `${boxDest[0]},${boxDest[1]}`;
    if (level.walls.has(boxDestKey)) throw new Error(`Empuje '${move}' choca contra pared en ${boxDestKey}`);
    if (state.boxes.has(boxDestKey)) throw new Error(`Empuje '${move}' choca contra otra caja en ${boxDestKey}`);
    const newBoxes = new Set(state.boxes);
    newBoxes.delete(destKey);
    newBoxes.add(boxDestKey);
    return { player: dest, boxes: newBoxes };
  }

  if (boxAhead) throw new Error(`'${move}' es paso simple pero hay caja en ${destKey}`);
  return { player: dest, boxes: state.boxes };
}

function replay(level, solution) {
  const trace = [{ player: level.initialPlayer, boxes: new Set(level.initialBoxes) }];
  for (const move of solution) {
    trace.push(applyMove(trace[trace.length - 1], level, move));
  }
  return trace;
}

function isGoal(state, level) {
  for (const b of state.boxes) if (!level.goals.has(b)) return false;
  return true;
}

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------
let level, trace;
try {
  level = parseLevel(LEVEL_LINES);
  trace = replay(level, SOLUTION);
} catch (err) {
  document.getElementById("error").style.display = "block";
  document.getElementById("error").textContent = "Error al reproducir la solución: " + err.message;
  throw err;
}

const boardEl = document.getElementById("board");
boardEl.style.gridTemplateColumns = `repeat(${level.width}, 30px)`;
boardEl.style.gridTemplateRows = `repeat(${level.height}, 30px)`;

const cells = [];
for (let y = 0; y < level.height; y++) {
  const row = [];
  for (let x = 0; x < level.width; x++) {
    const key = `${x},${y}`;
    const cellEl = document.createElement("div");
    if (level.walls.has(key)) {
      cellEl.className = "cell wall";
    } else {
      cellEl.className = "cell floor" + (level.goals.has(key) ? " goal" : "");
    }
    boardEl.appendChild(cellEl);
    row.push(cellEl);
  }
  cells.push(row);
}

let step = 0;
let playing = false;
let timer = null;

function render() {
  const state = trace[step];
  // limpiar tokens de caja/jugador de la celda anterior
  cells.forEach((row, y) => row.forEach((cellEl, x) => {
    if (!level.walls.has(`${x},${y}`)) cellEl.innerHTML = "";
  }));

  for (const boxKey of state.boxes) {
    const [bx, by] = boxKey.split(",").map(Number);
    const box = document.createElement("div");
    box.className = "box" + (level.goals.has(boxKey) ? " on-goal" : "");
    cells[by][bx].appendChild(box);
  }
  const [px, py] = state.player;
  const player = document.createElement("div");
  player.className = "player";
  cells[py][px].appendChild(player);

  document.getElementById("counter-val").textContent = step;
  document.getElementById("counter-total").textContent = SOLUTION.length;
  renderTrace();
  document.getElementById("btn-play").innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
}

function renderTrace() {
  const parts = [];
  for (let i = 0; i < SOLUTION.length; i++) {
    const cls = i < step ? "done" : i === step ? "current" : "pending";
    parts.push(`<span class="${cls}">${SOLUTION[i]}</span>`);
  }
  document.getElementById("solution-trace").innerHTML = parts.join("");
}

function goTo(n) {
  step = Math.max(0, Math.min(trace.length - 1, n));
  render();
}

function stepForward() {
  if (step >= trace.length - 1) { pause(); return; }
  goTo(step + 1);
}

function play() {
  if (playing) return;
  playing = true;
  const speed = Number(document.getElementById("speed").value);
  timer = setInterval(stepForward, 1000 / speed);
  render();
}

function pause() {
  playing = false;
  clearInterval(timer);
  render();
}

document.getElementById("btn-play").addEventListener("click", () => (playing ? pause() : play()));
document.getElementById("btn-next").addEventListener("click", () => { pause(); stepForward(); });
document.getElementById("btn-prev").addEventListener("click", () => { pause(); goTo(step - 1); });
document.getElementById("btn-first").addEventListener("click", () => { pause(); goTo(0); });
document.getElementById("btn-last").addEventListener("click", () => { pause(); goTo(trace.length - 1); });
document.getElementById("speed").addEventListener("input", (e) => {
  document.getElementById("speed-label").textContent = `${e.target.value} mov/s`;
  if (playing) { clearInterval(timer); timer = setInterval(stepForward, 1000 / Number(e.target.value)); }
});
document.getElementById("solution-trace").addEventListener("click", (e) => {
  // permite clickear un char del string de la solución para saltar ahí
  const idx = Array.from(document.getElementById("solution-trace").children).indexOf(e.target);
  if (idx >= 0) { pause(); goTo(idx); }
});

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") { pause(); stepForward(); }
  else if (e.key === "ArrowLeft") { pause(); goTo(step - 1); }
  else if (e.key === "Home") { pause(); goTo(0); }
  else if (e.key === "End") { pause(); goTo(trace.length - 1); }
  else if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
});

// stats
document.getElementById("level-name").textContent = LEVEL_NAME;
document.getElementById("stat-algorithm").textContent = RUN.algorithm ?? "-";
document.getElementById("stat-heuristic").textContent = RUN.heuristic ?? "n/a";
document.getElementById("stat-config").textContent = RUN.config_path ?? "-";
document.getElementById("stat-generated-at").textContent = RUN.generated_at ?? "-";
document.getElementById("stat-success").textContent = RESULT.success ? "true" : "false";
document.getElementById("stat-success").className = RESULT.success ? "ok" : "fail";
document.getElementById("stat-cost").textContent = RESULT.cost;
document.getElementById("stat-nodes").textContent = RESULT.nodes_expanded;
document.getElementById("stat-frontier").textContent = RESULT.frontier_nodes;
document.getElementById("stat-elapsed").textContent = RESULT.elapsed_seconds.toExponential(3) + " s";
if (RUN.board) {
  document.getElementById("stat-board").textContent = `${RUN.board.width} x ${RUN.board.height}`;
  document.getElementById("stat-boxes").textContent = `${RUN.board.boxes} / ${RUN.board.goals}`;
}
if (RUN.moves) {
  document.getElementById("stat-moves").textContent = `${RUN.moves.pushes} / ${RUN.moves.steps}`;
}

const finalOk = isGoal(trace[trace.length - 1], level);
if (!finalOk) {
  document.getElementById("error").style.display = "block";
  document.getElementById("error").textContent = "El estado final de la traza no cumple is_goal().";
}

render();
</script>
</body>
</html>
